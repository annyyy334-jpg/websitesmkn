<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK Negeri 1 Banyuwangi - Unggul & Berkarakter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head> 
<body>
    <style>
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .gradient-text {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hover-card:hover {
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .badge-new {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes blob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Navigasi -->
    <nav class="glass-nav sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center text-white font-bold text-xl">
                    <img src="assets/img/sekolah logo (1).png" alt="">
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-blue-900">SMKN 1 Banyuwangi</h1>
                     <p id="welcome" class="text-blue-600 font-semibold"></p> <!-- tempat menampilkan nama pengguna yang login -->
                    <p class="text-xs text-gray-500 uppercase tracking-widest">Banyuwangi</p>
                </div>
            </div>
            
            <!-- Navbar -->
            <div class="hidden lg:flex items-center gap-8 font-semibold text-gray-700">
                <a href="index.html" class="text-blue-600 border-b-2 border-blue-600">Beranda</a>
                <div class="relative group">
                    <button class="hover:text-blue-600 flex items-center gap-1">Profil <i class="fas fa-chevron-down text-xs"></i></button>
                    
                    <!-- Dropdown -->
                    <div class="absolute left-0 mt-2 w-56 bg-white shadow-xl rounded-lg py-3 
                                opacity-0 invisible group-hover:opacity-100 group-hover:visible 
                                transition duration-300 z-50">
                        <a href="sambutan.html" class="block px-5 py-3 hover:bg-gray-100">Sambutan Kepala sekolah</a>
                        <a href="visi.html" class="block px-5 py-3 hover:bg-gray-100">Visi & Misi</a>
                        <a href="fasilitas.html" class="block px-5 py-3 hover:bg-gray-100">Fasilitas</a>
                        <a href="ekstrakulikuler.html" class="block px-5 py-3 hover:bg-gray-100">Ekstrakulikuler</a>
                    </div>
                </div>
                <a href="jurusan.html" class="hover:text-blue-600">Jurusan</a>
                <a href="https://spmbjatim.net/" class="hover:text-blue-600 flex items-center">
                    SPMB 2026
                    <span class="ml-2 px-2 py-0.5 bg-red-500 text-white text-[10px] rounded-full badge-new">NEW</span>
                </a>
                <a href="galeri.html" class="hover:text-blue-600">Galeri</a>
                <a href="#" class="hover:text-blue-600">Kontak</a>
            </div>

            <a id="btnLogin"
            href="login.html"
            class="bg-blue-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-blue-700 transition lg:block hidden text-center">
            Login
            </a>

            <!-- Mobile Toggle -->
            <button class="lg:hidden text-2xl" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden lg:hidden bg-white border-t p-6 space-y-4 shadow-xl">
            <a href="index.html" class="block font-semibold">Beranda</a>
           
            <button id="btnProfilMobile" class="w-full text-left font-semibold flex items-center justify-between">
                Profil
                <i class="fas fa-chevron-down text-xs"></i>
            </button>

            <!-- Dropdown Mobile -->
            <div id="dropdownProfilMobile" class="hidden bg-gray-100 rounded-lg p-3 space-y-2">
                <a href="profil.html#visi-misi" class="block py-2 px-3 hover:bg-gray-200 rounded">Visi & Misi</a>

                <a href="profil.html#ekstrakulikuler" class="block py-2 px-3 hover:bg-gray-200 rounded">Ekstrakulikuler</a>
               <a href="profil.html#sambutan" class="block py-2 px-3 hover:bg-gray-200 rounded">Sambutan Kepala Sekolah</a>
            </div>
        
            <a href="jurusan.html" class="hover:text-blue-600">Jurusan</a>
            <a href="https://spmbjatim.net" class="block font-semibold text-red-500">PPDB 2026</a>
            <a href="galeri.html" class="block font-semibold">Galeri</a>
            <a href="#" class="block font-semibold">Kontak</a>
        </div>
    </nav>
</body>
</html>
